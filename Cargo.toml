[package]
name = "my-wx78"
version = "0.2.0"
edition = "2024"

[dependencies]
# 本地 qq-bot 0.6.0（git origin 尚无 markdown API；SDK 本体未改，见 push-architecture 批次三）
qq-bot = { path = "../qq-bot" }
canonical-msg = { path = "../push-architecture/canonical-msg" }
dispatch-core = { path = "../push-architecture/dispatch-core" }
streams-lib = { path = "../push-architecture/streams-lib" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
redis = { version = "0.29", features = ["tokio-comp"] }
dotenvy = "0.15"
anyhow = "1"
serde_json = "1"
ulid = "1"
jiff = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"